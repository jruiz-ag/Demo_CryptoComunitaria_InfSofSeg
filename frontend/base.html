<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ledger Municipal Acorazado{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #05070f;
            --bg-surface: #0c0f1d;
            --bg-surface-elevated: #141933;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.12);
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.08);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.1);
            --error: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.12);
            --state-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.05);
            --radius-lg: 14px;
            --radius-md: 8px;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Iluminación perimetral de fondo de bajo contraste para evitar fatiga visual */
        body::before {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px;
            flex-grow: 1;
        }

        /* ── NAVBAR ERGONÓMICA (.nav) ── */
        .nav {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 14px 24px;
            border-radius: var(--radius-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .nav span {
            font-size: 0.95rem;
            font-weight: 500;
            color: #cbd5e1;
        }
        .nav strong {
            color: var(--accent);
            font-weight: 700;
        }

        /* Botón de desconexión unificado */
        .logout {
            color: var(--error) !important;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            padding: 8px 16px;
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: var(--radius-md);
            background: rgba(244, 63, 94, 0.03);
            transition: all 0.2s ease;
        }
        .logout:hover {
            background: var(--error-glow);
            border-color: var(--error);
        }

        /* Encabezados legibles */
        h2 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        /* ── GRID DE COMPONENTES (.grid) ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 35px;
        }

        /* ── CONTROL ESTRICTO DE ICONOS (Evita que las imágenes se hagan gigantes) ── */
        svg, img, .icon, .icon-lg, .icon-xl, .nav svg, .card svg, .tx-item svg {
            width: 20px !important;
            height: 20px !important;
            max-width: 20px !important;
            max-height: 20px !important;
            display: inline-block;
            vertical-align: middle;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            flex-shrink: 0;
        }
        /* Iconos de balance destacados ligeramente mayores pero controlados */
        .balance svg, .balance img, .icon-lg {
            width: 28px !important;
            height: 28px !important;
            max-width: 28px !important;
            max-height: 28px !important;
        }

        /* ── TARJETAS CONTENEDORAS ESPACIOSAS (.card) ── */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        /* Indicadores de Tipo de Moneda en Tarjetas */
        .card.basica { border-left: 3px solid var(--warning); }
        .card.bonificada { border-left: 3px solid var(--success); }

        /* Mapeo del Balance Numérico (.balance) */
        .balance {
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
        }

        /* Badges informativos de la UI */
        .badge, [style*="background:#e0f2fe"], [style*="background:var(--primary-dark)"] {
            font-size: 0.72rem !important;
            font-weight: 700;
            padding: 4px 10px !important;
            border-radius: 4px !important;
            font-family: var(--font-mono);
            text-transform: uppercase;
            background: var(--bg-surface-elevated) !important;
            color: var(--accent) !important;
            border: 1px solid rgba(0, 240, 255, 0.15) !important;
            display: inline-block;
            margin-top: 6px;
            width: fit-content;
        }

        /* ── FORMULARIOS LIMPIOS Y CONFORTABLES ── */
        .input-group, form div {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.95rem;
            font-family: var(--font-mono);
            transition: border-color 0.2s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button, [type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        button:hover, [type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }
        button:active, [type="submit"]:active { transform: translateY(0); }

        /* Visor PEM de clave pública inyectada */
        pre, textarea, [style*="font-family: monospace"] {
            background: #04060b !important;
            color: #34d399 !important;
            border: 1px solid var(--border-color) !important;
            border-radius: var(--radius-md) !important;
            padding: 12px !important;
            font-size: 0.8rem !important;
            line-height: 1.4 !important;
            overflow-x: auto;
        }

        /* ── COMPONENTE HISTORIAL / FILAS DEL LEDGER (.tx-item) ── */
        .tx-list, #tx-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .tx-item, [class*="tx-item"] {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tx-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .tx-op {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tx-route {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .tx-amount {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Estado del Par Criptográfico (Firma Válida) */
        .firma-badge, [class*="firma-badge"], [style*="color: #10b981"] {
            font-size: 0.72rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            font-family: var(--font-mono);
            background: var(--success-glow) !important;
            color: #34d399 !important;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .firma-ko {
            background: var(--error-glow) !important;
            color: #fb7185 !important;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        /* Alertas Flasheadas del Framework */
        .flash-container { margin-bottom: 24px; }
        .flash-msg {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            border: 1px solid transparent;
        }
        .flash-msg.success { background-color: var(--success-glow); color: #34d399; border-color: rgba(16, 185, 129, 0.15); }
        .flash-msg.error { background-color: var(--error-glow); color: #fb7185; border-color: rgba(244, 63, 94, 0.15); }

        /* Footer Técnico */
        .system-footer {
            margin-top: auto;
            padding: 20px 24px;
            background-color: #04060b;
            border-top: 1px solid var(--border-color);
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, msg in messages %}
                        <div class="flash-msg {{ category }}">
                            <span style="width:6px; height:6px; border-radius:50%; background: currentColor;"></span>
                            {{ msg }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <footer class="system-footer">
        <div>🔒 Entorno Criptográfico Multi-Rol — ISS 2026 UMA</div>
        <div>
            <form action="{{ url_for('auth.reset') }}" method="POST" style="display: inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" style="background: none; border: none; color: var(--error); cursor: pointer; font-family: var(--font-mono); font-weight: 600; box-shadow: none; padding: 0; width: auto; display: inline; font-size: 0.8rem;">
                    [☣️ Forzar Reinicio del Estado Lógico]
                </button>
            </form>
        </div>
    </footer>

</body>
</html>
