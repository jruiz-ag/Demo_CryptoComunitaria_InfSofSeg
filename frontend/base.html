<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Municipal de Criptoactivos{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0f172a;   
            --primary: #1e293b;        
            --accent: #3b82f6;         
            --accent-hover: #2563eb;
            --success: #10b981;        
            --warning: #f59e0b;        
            --state: #8b5cf6;          
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); 
            margin: 0; padding: 40px 20px; 
            color: var(--text-main); line-height: 1.6;
        }

        .container { max-width: 900px; margin: 0 auto; }
        h1, h2, h3 { color: var(--primary-dark); font-weight: 700; margin-top: 0; }
        h2 { font-size: 1.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }

        /* Estilos globales para SVGs */
        svg { vertical-align: middle; }
        .icon { width: 1.2em; height: 1.2em; }
        .icon-lg { width: 1.5em; height: 1.5em; }
        .icon-xl { width: 2em; height: 2em; }

        .nav { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--primary-dark); color: white;
            padding: 15px 25px; border-radius: 12px; margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .nav strong { color: #f8fafc; font-weight: 600; }
        .logout { 
            background: rgba(255,255,255,0.1); color: white; text-decoration: none; 
            padding: 8px 16px; border-radius: 6px; font-size: 0.875rem; font-weight: 600; transition: background 0.2s;
        }
        .logout:hover { background: rgba(239, 68, 68, 0.8); }

        .grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { 
            flex: 1; background: var(--bg-card); padding: 25px; 
            border-radius: 16px; border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: center; position: relative; overflow: hidden;
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .card.basica::before { background-color: var(--warning); }
        .card.bonificada::before { background-color: var(--success); }
        .card.state::before { background-color: var(--state); }
        
        .card h3 { color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 15px; }
        .card .balance { font-size: 2.5rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-top: 15px; }
        .badge.basica { background: #fef3c7; color: #b45309; }
        .badge.bonificada { background: #d1fae5; color: #047857; }
        .badge.state { background: #ede9fe; color: #6d28d9; }

        .form-section { background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: 600; color: var(--primary); font-size: 0.875rem; }
        input, select { 
            padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; 
            font-size: 1rem; color: var(--text-main); background-color: #f8fafc; font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); background-color: white; }
        
        button { 
            background-color: var(--accent); color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 1rem; font-weight: 600; 
            cursor: pointer; transition: background 0.2s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        button:hover { background-color: var(--accent-hover); }

        table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        th { background-color: #f1f5f9; color: var(--text-muted); font-weight: 600; font-size: 0.875rem; padding: 16px; text-align: left; text-transform: uppercase; }
        td { padding: 16px; background-color: white; border-top: 1px solid var(--border-color); font-size: 0.95rem; }
        tr:hover td { background-color: #f8fafc; }
        .mono { font-family: 'Courier New', Courier, monospace; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        .alert { padding: 16px; border-radius: 8px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .alert-error { background-color: #fef2f2; color: #b91c1c; border-left: 4px solid #ef4444; }
        .alert-success { background-color: #f0fdf4; color: #15803d; border-left: 4px solid #22c55e; }
        
        /* Estilos del Ledger en Vivo */
        .tx-feed { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); padding: 25px; margin-top: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .tx-feed h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 1.1rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f8fafc; transition: background 0.3s; }
        .tx-item:hover { background: #f8fafc; }
        .tx-item:last-child { border-bottom: none; }
        .tx-details { flex-grow: 1; }
        .tx-op { font-weight: 700; font-size: 0.85rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
        .tx-route { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
        .tx-amount { font-family: 'Courier New', monospace; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
        
        /* Badges de firma en el ledger */
        .firma-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em; vertical-align: middle; margin-left: 6px; }
        .firma-ok { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .firma-ko { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .firma-na { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }

        /* Caja de clave pública */
        .pubkey-box { background: #0f172a; border-radius: 12px; padding: 20px 24px; margin-bottom: 30px; border: 1px solid #1e293b; }
        .pubkey-header { color: #94a3b8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .pubkey-header svg { stroke: #64748b; }
        .pubkey-text { color: #34d399; font-family: 'Courier New', monospace; font-size: 0.78rem; margin: 0; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }

        /* Botón Reset Demo - Aislamiento Total y Centrado */
        .btn-reset-demo {
            background: transparent !important; 
            color: var(--text-muted) !important;
            border: none;
            padding: 0 !important; 
            width: auto !important; 
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 50px auto 0 auto; /* Lo separa del contenido y lo centra */
            transition: color 0.2s ease;
        }
        
        .btn-reset-demo:hover {
            color: #ef4444 !important; 
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'error' }}">
                        {% if category == 'success' %}
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        {% else %}
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        {% endif %}
                        {{ msg }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <form action="{{ url_for('auth.reset') }}" method="POST" style="margin: 0; padding: 0;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn-reset-demo">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reiniciar demo
        </button>
    </form>
</body>
</html>
