<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ledger Municipal Acorazado{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colores de Fondo y Superficie */
            --bg-main: #f4f6fa;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #f8fafc;
            
            /* Identidad y Estados */
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.1);
            --accent: #0f172a;
            --success: #16a34a;
            --success-glow: rgba(22, 163, 74, 0.08);
            --warning: #ea580c;
            --warning-glow: rgba(234, 88, 12, 0.08);
            --error: #dc2626;
            --error-glow: rgba(220, 38, 38, 0.08);
            --state-purple: #7c3aed;
            
            /* Tipografía y Bordes */
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #d1d5db;
            --border-light: #e5e7eb;
            --radius-lg: 16px;
            --radius-md: 10px;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Capas de Relieve y Sombras Profesionales (Multi-layered Depth) */
            --relief-sm: 0 1px 2px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --relief-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 1);
            --relief-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 1);
            --relief-button: 0 2px 4px rgba(37, 99, 235, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            --relief-input: inset 0 2px 4px rgba(0, 0, 0, 0.04), 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            flex-grow: 1;
        }

        /* NAVBAR PREMIUM CON RELIEVE DE CRISTAL */
        .nav {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            padding: 18px 28px;
            border-radius: var(--radius-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            box-shadow: var(--relief-md);
        }
        .nav span {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
        }
        .nav strong {
            color: var(--primary);
            font-weight: 600;
        }

        .logout {
            color: var(--error) !important;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 10px 20px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-surface-elevated);
            box-shadow: var(--relief-sm);
            transition: all 0.15s ease;
        }
        .logout:hover {
            background: var(--error-glow);
            border-color: var(--error);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(220, 38, 38, 0.08);
        }
        .logout:active {
            transform: translateY(1px);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 35px;
        }

        /* SVGS INTEGRADOS */
        svg, img, .icon, .icon-lg, .icon-xl {
            width: 18px !important;
            height: 18px !important;
            display: inline-block;
            vertical-align: middle;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            flex-shrink: 0;
        }
        .balance svg, .icon-lg {
            width: 26px !important;
            height: 26px !important;
        }

        /* TARJETAS CON RELIEVE ACENTUADO */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 26px;
            box-shadow: var(--relief-lg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .card h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 14px;
            font-weight: 600;
        }

        .card.basica { border-top: 4px solid var(--warning); }
        .card.bonificada { border-top: 4px solid var(--success); }

        .balance {
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 0;
        }

        /* BADGES ESTILIZADOS */
        .badge {
            font-size: 0.7rem !important;
            font-weight: 700;
            padding: 6px 10px !important;
            border-radius: 6px !important;
            font-family: var(--font-sans);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            background: var(--bg-surface-elevated) !important;
            color: var(--text-muted) !important;
            border: 1px solid var(--border-light) !important;
            box-shadow: var(--relief-sm);
            display: inline-block;
            margin-top: 8px;
            width: fit-content;
        }
        .badge.basica { background: var(--warning-glow) !important; color: var(--warning) !important; border-color: transparent !important; box-shadow: none; }
        .badge.bonificada { background: var(--success-glow) !important; color: var(--success) !important; border-color: transparent !important; box-shadow: none; }

        /* CONTENEDORES Y FORMULARIOS */
        .form-section {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 35px;
            box-shadow: var(--relief-lg);
        }
        .input-group, form div {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }
        
        /* INPUTS BISELADOS INTERNOS */
        input[type="text"], input[type="number"], input[type="password"], select {
            width: 100%;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: var(--font-sans);
            box-shadow: var(--relief-input);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus, select:focus {
            outline: none;
            background: var(--bg-surface);
            border-color: var(--primary);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02), 0 0 0 4px var(--primary-glow);
        }

        /* BOTONES MECÁNICOS 3D SENSIBLES AL TACTO */
        button, [type="submit"] {
            width: 100%;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 16px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--relief-button);
            transition: all 0.15s ease;
        }
        button:hover, [type="submit"]:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.25);
        }
        button:active, [type="submit"]:active {
            transform: translateY(1px);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        pre {
            background: #0f172a !important;
            color: #38bdf8 !important;
            border: 1px solid rgba(0,0,0,0.2) !important;
            border-radius: var(--radius-md) !important;
            padding: 18px !important;
            font-size: 0.85rem !important;
            font-family: var(--font-mono) !important;
            line-height: 1.6 !important;
            box-shadow: var(--relief-input);
            overflow-x: auto;
        }

        /* TRANSACCIONES (LEDGER) */
        .tx-list, #tx-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 18px;
        }
        .tx-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--relief-sm);
            transition: all 0.2s ease;
        }
        .tx-item:hover {
            transform: scale(1.005) translateY(-1px);
            box-shadow: var(--relief-md);
            background: var(--bg-surface-elevated);
        }
        .tx-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tx-op {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tx-route {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .tx-amount {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* FIRMAS CRIPTOGRÁFICAS */
        .firma-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            background: var(--bg-surface-elevated);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .firma-badge.firma-ok {
            background: #e6f4ea !important;
            color: var(--success) !important;
            border-color: #a3e635 !important;
        }
        .firma-badge.firma-ko {
            background: #fce8e6 !important;
            color: var(--error) !important;
            border-color: #fca5a5 !important;
        }

        /* ALERTAS FLASH */
        .flash-container { margin-bottom: 24px; }
        .flash-msg {
            padding: 16px 20px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            box-shadow: var(--relief-md);
        }
        .flash-msg.success { background-color: #e6f4ea; color: var(--success); border-left: 5px solid var(--success); }
        .flash-msg.error { background-color: #fce8e6; color: var(--error); border-left: 5px solid var(--error); }

        /* FOOTER */
        .system-footer {
            margin-top: auto;
            padding: 28px;
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-light);
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            box-shadow: inset 0 1px 0 rgba(255,255,255,1);
        }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, msg in messages %}
                        <div class="flash-msg {{ category }}">
                            <span style="width:8px; height:8px; border-radius:50%; background: currentColor;"></span>
                            {{ msg }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <footer class="system-footer">
        <div style="font-weight: 500;">🔒 Crypto Comunitaria</div>
        <div>
            <form action="{{ url_for('auth.reset') }}" method="POST" style="display: inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" style="background: none; border: none; color: var(--error); cursor: pointer; font-family: var(--font-mono); font-weight: 700; box-shadow: none; padding: 0; width: auto; display: inline; font-size: 0.8rem; transition: none;">
                    [☣️ Forzar Reinicio Estructural Lógico]
                </button>
            </form>
        </div>
    </footer>
</body>
</html>
