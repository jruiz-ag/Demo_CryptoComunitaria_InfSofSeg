{% extends 'base.html' %}
{% block title %}Acceso Perimetral Autenticado{% endblock %}

{% block content %}
<style>
    .login-wrapper {
        max-width: 480px;
        margin: 40px auto;
    }
    .input-group {
        margin-bottom: 20px;
    }
    .input-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
        color: var(--text-muted);
    }
    .input-group input {
        width: 100%;
        background-color: var(--bg-surface-elevated);
        border: 1px solid var(--border-color);
        padding: 14px;
        border-radius: var(--radius-md);
        color: white;
        font-size: 1rem;
        font-family: var(--font-mono);
    }
    .input-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .demo-badge-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 24px;
    }
    .demo-btn {
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-color);
        padding: 14px;
        border-radius: var(--radius-md);
        color: var(--text-main);
        cursor: pointer;
        text-align: left;
        font-size: 0.9rem;
    }
    .demo-btn:hover {
        border-color: var(--accent);
        background-color: rgba(0, 240, 255, 0.03);
    }
    .tech-header {
        text-align: center;
        margin-bottom: 32px;
    }
    .tech-header h1 {
        font-size: 2rem;
        background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
    }
</style>

<div class="login-wrapper">
    <div class="tech-header">
        <h1>NODO GENERAL DE ACCESO</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Capa Perimetral Verificada por Contratos de Validación Sintáctica</p>
    </div>

    <div class="crypto-card">
        <form action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="input-group">
                <label for="username">Identificador de Usuario (Username)</label>
                <input type="text" id="username" name="username" required autocomplete="off"
                       pattern="^[a-zA-Z0-9_-]{3,32}$"
                       title="Restricción: Entre 3 y 32 caracteres alfanuméricos permitidos en lista blanca.">
            </div>

            <div class="input-group">
                <label for="password">Clave de Acceso Secreta (Password)</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-secure" style="width: 100%;">
                Verificar Credenciales e Iniciar Sesión
            </button>
        </form>
    </div>

    <div style="margin-top: 32px;">
        <h3 style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); text-align: center; letter-spacing: 0.05em; margin-bottom: 16px;">
            Inyector de Tokens de Identidad (Modo de Demostración)
        </h3>
        <div class="demo-badge-grid">
            <button class="demo-btn" onclick="inject('alice')">👤 <strong>Alice</strong><br><span style="font-size:0.75rem; color:var(--text-muted)">Citizen Perfil</span></button>
            <button class="demo-btn" onclick="inject('bob')">👤 <strong>Bob</strong><br><span style="font-size:0.75rem; color:var(--text-muted)">Citizen Perfil</span></button>
            <button class="demo-btn" onclick="inject('comercio_local')">🏪 <strong>Comercio</strong><br><span style="font-size:0.75rem; color:var(--text-muted)">Commerce Perfil</span></button>
            <button class="demo-btn" onclick="inject('estado')" style="border-left: 3px solid var(--state-purple);">🏛️ <strong>Estado</strong><br><span style="font-size:0.75rem; color:var(--state-purple)">State Root</span></button>
        </div>
    </div>
</div>

<script>
    function inject(user) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = 'password123';
    }
</script>
{% endblock %}
